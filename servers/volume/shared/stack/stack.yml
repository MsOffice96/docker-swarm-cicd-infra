version: "3.9"

services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == worker
      resources: # only apply when using Docker Stack
        limits: # Task-level resource limit. exceeding them causes the task to be killed
          cpus: "0.2"
          memory: 256M
        reservations: # The Scheduling criteria to ensure tasks run only on nodes that have the required resources
          cpus: "0.1"
          memory: 138M
    networks:
      - webnet

networks:
  webnet:
    driver: overlay